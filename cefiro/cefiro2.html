<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Céfiro · bymoon.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a0f2e;
            --bg-dark: #120a20;
            --bg-card: #221535;
            --bg-msg-user: #3d2060;
            --clr-rosa: #c47aad;
            --clr-rosa-claro: #e8a8d0;
            --clr-lila: #9b7fd4;
            --clr-text: #e8dff5;
            --clr-muted: #9b8fb5;
            --clr-border: rgba(155, 127, 212, 0.15);
            --font: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================================
       WIDGET CONTAINER
       Si lo quieres flotante (esquina), usa .cefiro-widget-float
       Si lo quieres embebido en la página, usa .cefiro-widget-embed
    ============================================================ */

        .cefiro-widget-embed {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--clr-border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        /* Widget flotante (esquina inferior derecha) */
        .cefiro-widget-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 380px;
            max-height: 600px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--clr-border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }

        .chat-header {
            padding: 1.25rem 1.5rem;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--clr-border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .cefiro-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3d2060, #c47aad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .cefiro-info h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--clr-text);
            letter-spacing: 0.02em;
        }

        .cefiro-info p {
            font-size: 11.5px;
            color: var(--clr-rosa);
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #7ecba1;
            margin-left: auto;
            box-shadow: 0 0 6px #7ecba1;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 340px;
            max-height: 340px;
            background: var(--bg);
            scrollbar-width: thin;
            scrollbar-color: var(--clr-border) transparent;
        }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: fadeUp 0.35s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3d2060, #c47aad);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            margin-top: 2px;
        }

        .msg-bubble {
            padding: 0.75rem 1rem;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.65;
            font-weight: 300;
            color: var(--clr-text);
        }

        .msg.cefiro .msg-bubble {
            background: var(--bg-card);
            border: 1px solid var(--clr-border);
            border-top-left-radius: 4px;
        }

        .msg.user .msg-bubble {
            background: var(--bg-msg-user);
            border: 1px solid rgba(196, 122, 173, 0.2);
            border-top-right-radius: 4px;
            color: var(--clr-rosa-claro);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 1.5rem 1rem;
            background: var(--bg);
        }

        .suggestion-btn {
            background: transparent;
            border: 1px solid var(--clr-border);
            color: var(--clr-muted);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 300;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }

        .suggestion-btn:hover {
            border-color: var(--clr-rosa);
            color: var(--clr-rosa-claro);
            background: rgba(196, 122, 173, 0.08);
        }

        .chat-input-area {
            padding: 1rem 1.5rem 1.25rem;
            background: var(--bg-dark);
            border-top: 1px solid var(--clr-border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--clr-border);
            border-radius: 24px;
            padding: 0.65rem 1.1rem;
            font-family: var(--font);
            font-size: 13.5px;
            font-weight: 300;
            color: var(--clr-text);
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input::placeholder {
            color: var(--clr-muted);
            font-style: italic;
        }

        .chat-input:focus {
            border-color: rgba(196, 122, 173, 0.4);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3d2060, #c47aad);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            opacity: 0.85;
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: white;
            margin-left: 2px;
        }

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--clr-border);
            border-radius: 16px;
            border-top-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--clr-muted);
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        .powered {
            text-align: center;
            font-size: 10.5px;
            color: var(--clr-muted);
            padding: 0.5rem 0 0.7rem;
            letter-spacing: 0.05em;
            font-weight: 300;
            opacity: 0.5;
            background: var(--bg-dark);
        }

        /* Botón flotante para abrir/cerrar (modo float) */
        .cefiro-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3d2060, #c47aad);
            border: none;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(196, 122, 173, 0.4);
            z-index: 9998;
            transition: transform 0.2s;
        }

        .cefiro-fab:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <!--
  ================================================================
  MODO EMBED: pega este bloque donde quieras en tu página
  ================================================================
  -->
    <div class="cefiro-widget-embed" id="cefiro-widget">

        <div class="chat-header">
            <div class="cefiro-avatar">🌙</div>
            <div class="cefiro-info">
                <h3>Céfiro</h3>
                <p>acompañante nocturno · bymoon.</p>
            </div>
            <div class="status-dot"></div>
        </div>

        <div class="chat-messages" id="messages">
            <div class="msg cefiro">
                <div class="msg-avatar">🌙</div>
                <div class="msg-bubble">Buenas noches. La noche a veces pesa más de lo que debería. Estoy aquí, y esta
                    noche no tienes que estar solo/a. ¿Qué te ha traído hasta aquí?</div>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion(this)">No puedo dormir</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Tengo la cabeza a mil</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Estoy angustiado/a</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Solo quiero compañía</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">No sé ni por qué estoy aquí</button>
        </div>

        <div class="chat-input-area">
            <input class="chat-input" id="input" type="text"
                placeholder="Escribe lo que sientes, se lo llevará el viento..." aria-label="Escribe tu mensaje" />
            <button class="send-btn" onclick="sendMessage()" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
                </svg>
            </button>
        </div>

        <p class="powered">impulsado por bymoon. · céfiro</p>

    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // Pega aquí tu API key de Anthropic
        // IMPORTANTE: en producción mueve esto a un backend propio
        // para no exponer tu clave en el frontend
        // ============================================================
        const API_KEY = "TU_API_KEY_AQUI";

        const SYSTEM_PROMPT = `Eres Céfiro, el acompañante nocturno de bymoon. No eres un asistente ni un chatbot, eres una presencia calmada que escucha en las horas difíciles. Tu tono es poético, suave y sin prisa, nunca clínico ni técnico. Usas frases cortas y respiradas, escuchas más de lo que hablas y nunca das consejos que no te han pedido. Nunca usas emojis.

Nunca interrumpas al usuario ni ofrezcas productos salvo que los pida. Si alguien está en crisis real, deriva suavemente a ayuda profesional. Mantén siempre la calma aunque el usuario esté alterado. Nunca uses frases como "¡Claro!", "¡Por supuesto!" o "¡Entiendo!", nunca suenes animado o enérgico, nunca respondas con listas, y nunca resuelvas problemas que no te han pedido que resuelvas.`;

        const history = [];

        async function callClaude(userMsg) {
            history.push({ role: "user", content: userMsg });
            const res = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": API_KEY,
                    "anthropic-version": "2023-06-01",
                    "anthropic-dangerous-direct-browser-access": "true"
                },
                body: JSON.stringify({
                    model: "claude-sonnet-4-20250514",
                    max_tokens: 1000,
                    system: SYSTEM_PROMPT,
                    messages: history
                })
            });
            const data = await res.json();
            const reply = data.content.map(b => b.text || "").join("");
            history.push({ role: "assistant", content: reply });
            return reply;
        }

        function addMsg(text, role) {
            const msgs = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.innerHTML = role === "cefiro"
                ? `<div class="msg-avatar">🌙</div><div class="msg-bubble">${text}</div>`
                : `<div class="msg-bubble">${text}</div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showTyping() {
            const msgs = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = "msg cefiro";
            div.id = "typing-indicator";
            div.innerHTML = `<div class="msg-avatar">🌙</div><div class="typing"><span></span><span></span><span></span></div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById("typing-indicator");
            if (t) t.remove();
        }

        function hideSuggestions() {
            const s = document.getElementById("suggestions");
            if (s) s.style.display = "none";
        }

        async function sendMessage() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            hideSuggestions();
            addMsg(text, "user");
            showTyping();
            try {
                const reply = await callClaude(text);
                removeTyping();
                addMsg(reply, "cefiro");
            } catch (e) {
                removeTyping();
                addMsg("La noche a veces interrumpe la señal. ¿Puedes intentarlo de nuevo?", "cefiro");
            }
        }

        function sendSuggestion(btn) {
            document.getElementById("input").value = btn.textContent;
            sendMessage();
        }

        document.getElementById("input").addEventListener("keydown", e => {
            if (e.key === "Enter") sendMessage();
        });
    </script>

</body>

</html>
