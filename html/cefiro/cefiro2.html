<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Céfiro | BYMOON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/utility-clases_variables.css" />
    <link rel="stylesheet" href="/css/estrellas.css" />
    <style>
        :root {
            --bg-card: hsl(262, 55%, 12%);
            --clr-muted: hsla(260, 30%, 83%, 0.5);
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: transparent !important;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--clr-corporativo-primario-lila);
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .back-btn svg {
            width: 1.25rem;
            height: 1.25rem;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .cefiro-widget-embed {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent !important;
        }

        .chat-header {
            padding: 1.25rem 1.5rem;
            background: var(--clr-corporativo-fondo-darker);
            border-bottom: 1px solid var(--clr-corporativo-lavanda-low);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .cefiro-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background: var(--clr-corporativo-primario);
            border: 1px solid var(--clr-corporativo-lavanda-low);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            flex-shrink: 0;
        }

        .cefiro-info h1 {
            font-size: var(--font-size-h3-secundario-esc);
            font-weight: 600;
            color: var(--clr-corporativo-primario-lila);
            letter-spacing: 0.02em;
        }

        .cefiro-info p {
            font-size: var(--font-size-label);
            font-weight: 300;
            color: var(--clr-corporativo-secundario-rosa-medio);
            letter-spacing: 0.05em;
        }

        .status-dot {
            width: 0.4375rem;
            height: 0.4375rem;
            border-radius: 50%;
            background: #7ecba1;
            margin-left: auto;
            box-shadow: 0 0 6px #7ecba1;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--clr-corporativo-fondo-dark);
            scrollbar-width: thin;
            scrollbar-color: var(--clr-corporativo-lavanda-low) transparent;
            background: transparent;
        }

        .msg {
            display: flex;
            gap: 0.625rem;
            max-width: 75%;
            animation: fadeUp 0.35s ease;
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 1.875rem;
            height: 1.875rem;
            border-radius: 50%;
            background: var(--clr-corporativo-primario);
            border: 1px solid var(--clr-corporativo-lavanda-low);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8125rem;
            flex-shrink: 0;
            margin-top: 0.125rem;
        }

        .msg-bubble {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: var(--font-size-parrafo-footer-mobile);
            line-height: 1.65;
            font-weight: 300;
            color: var(--clr-corporativo-primario-lila);
        }

        .msg.cefiro .msg-bubble {
            background: var(--bg-card);
            border: 1px solid var(--clr-corporativo-lavanda-low);
            border-top-left-radius: 0.25rem;
        }

        .msg.user .msg-bubble {
            background: var(--clr-corporativo-primario);
            border: 1px solid hsla(294, 33%, 45%, 0.3);
            border-top-right-radius: 0.25rem;
            color: var(--clr-corporativo-secundario-rosa-claro);
        }

        .typing {
            display: flex;
            gap: 0.3125rem;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--clr-corporativo-lavanda-low);
            border-radius: 1rem;
            border-top-left-radius: 0.25rem;
            width: fit-content;
        }

        .typing span {
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 50%;
            background: var(--clr-muted);
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 1.5rem 1rem;
            background: var(--clr-corporativo-fondo-dark);
            background: transparent;
        }

        .suggestion-btn {
            background: transparent;
            border: 1px solid var(--clr-corporativo-lavanda-low);
            color: var(--clr-muted);
            font-size: var(--font-size-label);
            font-weight: 300;
            padding: 0.375rem 0.875rem;
            border-radius: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
            font-family: inherit;
        }

        .suggestion-btn:hover {
            border-color: var(--clr-corporativo-secundario-rosa-medio);
            color: var(--clr-corporativo-secundario-rosa-claro);
            background: hsla(294, 33%, 45%, 0.08);
        }

        .chat-input-area {
            padding: 1rem 1.5rem 1.25rem;
            background: var(--clr-corporativo-fondo-darker);
            border-top: 1px solid var(--clr-corporativo-lavanda-low);
            display: flex;
            align-items: center;
            gap: 0.625rem;
            flex-shrink: 0;
            /* para que no pierdan altura cuando la zona de mensajes crece. El flex: 1 del .chat-messages hace que sea esa zona la que absorba todo el espacio disponible, y el flex-shrink: 0 del resto garantiza que nunca le "roben" espacio a la zona de mensajes ni se aplasten entre ellos. */
        }

        .chat-input {
            flex: 1;
            background: var(--clr-corporativo-fondo-dark);
            border: 1px solid var(--clr-corporativo-lavanda-low);
            border-radius: 1.5rem;
            padding: 0.65rem 1.1rem;
            font-size: var(--font-size-comentarios);
            font-weight: 300;
            color: var(--clr-corporativo-primario-lila);
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: var(--clr-muted);
            font-style: italic;
        }

        .chat-input:focus {
            border-color: hsla(294, 33%, 45%, 0.4);
        }

        .send-btn {
            width: 2.375rem;
            height: 2.375rem;
            border-radius: 50%;
            background: var(--clr-corporativo-primario);
            border: 1px solid var(--clr-corporativo-secundario-rosa-medio);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.15s;
        }

        .send-btn:hover {
            opacity: 0.85;
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        .send-btn svg {
            width: 1rem;
            height: 1rem;
            fill: var(--clr-corporativo-primario-lila);
            margin-left: 0.125rem;
        }

        .powered {
            padding: 0.5rem 0 0.7rem;
            background: var(--clr-corporativo-fondo-darker);
            font-size: var(--font-size-label);
            font-weight: 300;
            color: var(--clr-muted);
            text-align: center;
            letter-spacing: 0.05em;
            opacity: 0.5;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="estrellas-1"></div>
    <div class="estrellas-2"></div>
    <div class="estrellas-3"></div>

    <div class="cefiro-widget-embed" id="cefiro-widget">

        <div class="chat-header">
            <a href="/index.html" class="back-btn" aria-label="Volver a la home">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5l-7 7 7 7" />
                </svg>
            </a>
            <div class="cefiro-avatar">🌙</div>
            <div class="cefiro-info">
                <h1>Céfiro</h1>
                <p>Acompañante nocturno</p>
            </div>
            <div class="status-dot"></div>
        </div>

        <div class="chat-messages" id="messages">
            <div class="msg cefiro">
                <div class="msg-avatar">🌙</div>
                <div class="msg-bubble">Buenas noches. La noche a veces pesa más de lo que debería. Estoy aquí, y esta
                    noche no tienes que estar solo/a. ¿Qué te ha traído hasta aquí?</div>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion(this)">No puedo dormir</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Tengo la cabeza a mil</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Estoy angustiado/a</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">Solo quiero compañía</button>
            <button class="suggestion-btn" onclick="sendSuggestion(this)">No sé ni por qué estoy aquí</button>
        </div>

        <div class="chat-input-area">
            <input class="chat-input" id="input" type="text"
                placeholder="Escribe lo que sientes, se lo llevará el viento..." aria-label="Escribe tu mensaje" />
            <button class="send-btn" onclick="sendMessage()" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
                </svg>
            </button>
        </div>

        <p class="powered">BYMOON · 2026</p>

    </div>

    <script>
        const history = [];

        async function callClaude(userMsg) {
            history.push({ role: "user", content: userMsg });
            const res = await fetch("/.netlify/functions/cefiro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: history })
            });
            const data = await res.json();
            const reply = data.reply;
            history.push({ role: "assistant", content: reply });
            return reply;
        }

        function addMsg(text, role) {
            const msgs = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.innerHTML = role === "cefiro"
                ? `<div class="msg-avatar">🌙</div><div class="msg-bubble">${text}</div>`
                : `<div class="msg-bubble">${text}</div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function showTyping() {
            const msgs = document.getElementById("messages");
            const div = document.createElement("div");
            div.className = "msg cefiro";
            div.id = "typing-indicator";
            div.innerHTML = `<div class="msg-avatar">🌙</div><div class="typing"><span></span><span></span><span></span></div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById("typing-indicator");
            if (t) t.remove();
        }

        function hideSuggestions() {
            const s = document.getElementById("suggestions");
            if (s) s.style.display = "none";
        }

        async function sendMessage() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            hideSuggestions();
            addMsg(text, "user");
            showTyping();
            try {
                const reply = await callClaude(text);
                removeTyping();
                addMsg(reply, "cefiro");
            } catch (e) {
                removeTyping();
                addMsg("La noche a veces interrumpe la señal. ¿Puedes intentarlo de nuevo?", "cefiro");
            }
        }

        function sendSuggestion(btn) {
            document.getElementById("input").value = btn.textContent;
            sendMessage();
        }

        document.getElementById("input").addEventListener("keydown", e => {
            if (e.key === "Enter") sendMessage();
        });
    </script>

</body>

</html>
