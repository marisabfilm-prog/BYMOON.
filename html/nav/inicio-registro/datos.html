<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datos | BYMOON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../../../css/utility-clases_variables.css" />
    <link rel="stylesheet" href="../../../css/estrellas.css" />
    <link rel="stylesheet" href="../../../css/botones.css" />
    <link rel="stylesheet" href="../../../css/footer-nav.css" />
    <link rel="stylesheet" href="../../../css/inicio-registro.css" />

</head>

<body>


    <main>
        <div class="estrellas-1"></div>
        <div class="estrellas-2"></div>
        <div class="estrellas-3"></div>

        <div class="login-card animar">
            <h1>Vamos a crear tu cuenta</h1>
            <p class="crear-subtitulo">Para obtener acceso a nuestro refugio nocturno...</p>

            <section class="campos">

                <div class="campo-datos">
                    <label class="campo-etiqueta" for="nombre">Nombre</label>
                    <input class="login-input" id="nombre" type="text" placeholder="Tu nombre"
                        autocomplete="given-name" />
                </div>

                <div class="campo-datos">
                    <label class="campo-etiqueta" for="fecha">Fecha de nacimiento</label>
                    <input class="login-input" id="fecha" type="date" autocomplete="bday" />
                </div>

                <div class="campo-datos">
                    <label class="campo-etiqueta" for="email">Correo electrónico</label>
                    <input class="login-input" id="email" type="email" placeholder="hola@gmail.com"
                        autocomplete="email" />
                </div>

                <div class="campo-datos">
                    <label class="campo-etiqueta" for="password">Contraseña</label>
                    <input class="login-input" id="password" type="password" placeholder="••••••••"
                        autocomplete="new-password" />
                </div>

                <div class="fila-checkbox">
                    <input class="checkbox-datos" id="terminos" type="checkbox" />
                    <label class="checkbox-etiqueta" for="terminos">
                        Al continuar, aceptas nuestros <a href="#">Términos y Condiciones</a> y la <a href="#">Política
                            de
                            Privacidad</a>.
                    </label>
                </div>

            </section>

            <a href="codigo-registro.html">
                <button class="login-btn-email">Continuar</button>
            </a>
        </div>
    </main>


    <script src="/js/utils/observer.js"></script>
    <script src="/js/utils/fade-in.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils/main.js"></script>
</body>

</html>
