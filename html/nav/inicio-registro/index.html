<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="BYMOON" />
    <link rel="manifest" href="/site.webmanifest" />


    <title>bymoon. — Inicia sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet" />


    <link rel="stylesheet" href="../../../css/utility-clases_variables.css" />
    <link rel="stylesheet" href="../../../css/estrellas.css" />
    <link rel="stylesheet" href="../../../css/botones.css" />
    <link rel="stylesheet" href="../../../css/footer-nav.css" />
    <link rel="stylesheet" href="../../../css/inicio-registro.css" />

</head>

<body>

    <main>
        <div class="estrellas-1"></div>
        <div class="estrellas-2"></div>
        <div class="estrellas-3"></div>

        <div class="login-card animar">
            <h1 class="login-titulo">
                Inicia sesión<br>
                <span>o regístrate</span>
            </h1>

            <div class="login-input-wrap">
                <input class="login-input" type="email" placeholder="hola@gmail.com" autocomplete="email" />
            </div>
            <a href="datos.html">
                <button class="login-btn-email">Continuar</button>
            </a>
            <div class="login-divisor">
                <div class="login-divisor-linea"></div>
                <div class="login-divisor-luna"></div>
                <div class="login-divisor-linea"></div>
            </div>

            <div class="login-social-row">
                <button class="login-social-btn" aria-label="Continuar con Google">
                    <img class="google" src="../../../svg/google.svg" alt="Continuar con Google" />
                </button>

                <button class="login-social-btn" aria-label="Continuar con Apple">
                    <img class="apple" src="../../../svg/apple.svg" alt="Continuar con Apple" />
                </button>
            </div>
        </div>
    </main>

    <script src="/js/utils/observer.js"></script>
    <script src="/js/utils/fade-in.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils/main.js"></script>
</body>

</html>
