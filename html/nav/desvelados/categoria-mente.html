<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MENTE | BYMOON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../../../css/utility-clases_variables.css" />
    <link rel="stylesheet" href="../../../css/estrellas.css" />
    <link rel="stylesheet" href="../../../css/botones.css" />
    <link rel="stylesheet" href="../../../css/footer-nav.css" />
    <link rel="stylesheet" href="../../../css/categoria.css" />

</head>

<body>


    <!-- PÁGINA DE CATEGORÍA: MENTE -->
    <main>

        <div class="estrellas-1"></div>
        <div class="estrellas-2"></div>
        <div class="estrellas-3"></div>


        <!-- CABECERA CATEGORÍA -->
        <section class="categoria-hero">
            <h1>Mente</h1>
            <p>Un rincón para soltar lo que pesa y ordenar todo el ruido interior.</p>
        </section>


        <!-- HILOS -->
        <section class="hilos">
            <div class="hilo-fila">


                <article class="hilo-imagen">
                    <img src="../../../jpg/categoria-1.jpg" alt="Hilo 1" />
                    <h2 class="hilo-titulo">HILO 1</h2>
                </article>

                <article class="hilo-imagen">
                    <img src="../../../jpg/categoria-1.jpg" alt="Hilo 2" />
                    <h2 class="hilo-titulo">HILO 2</h2>
                </article>

            </div>

            <div class="hilo-fila">

                <article class="hilo-imagen">
                    <img src="../../../jpg/categoria-2.jpg" alt="Hilo 3" />
                    <h2 class="hilo-titulo">HILO 3</h2>
                </article>

                <article class="hilo-imagen">
                    <img src="../../../jpg/categoria-2.jpg" alt="Hilo 4" />
                    <h2 class="hilo-titulo">HILO 4</h2>
                </article>

            </div>
        </section>
    </main>

    <script src="../../../js/utils/observer.js"></script>
    <script src="../../../js/categorias.js"></script>
    <script src="/js/utils/fade-in.js"></script>
    <script src="../../../js/nav.js"></script>
    <script src="../../../js/utils/main.js"></script>
