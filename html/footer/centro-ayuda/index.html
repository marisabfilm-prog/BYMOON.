<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Ayuda | BYMOON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet" />


    <link rel="stylesheet" href="../../../css/utility-clases_variables.css" />
    <link rel="stylesheet" href="../../../css/estrellas.css" />
    <link rel="stylesheet" href="../../../css/botones.css" />
    <link rel="stylesheet" href="../../../css/footer-nav.css" />
    <link rel="stylesheet" href="../../../css/centro-de-ayuda-main.css" />

</head>

<body>

    <main>

        <div class="estrellas-1"></div>
        <div class="estrellas-2"></div>
        <div class="estrellas-3"></div>

        <div class="centro-ayuda-wrap">

            <!-- CABECERA -->
            <a href="index.html" class="centro-ayuda-flecha" aria-label="Volver">
                <svg width="8" height="14" viewBox="0 0 8 14" fill="none">
                    <path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>

            <h1 class="centro-ayuda-titulo">Centro de Ayuda</h1>

            <!-- BUSCADOR -->
            <div class="centro-ayuda-buscador-wrap">

                <input class="centro-ayuda-buscador" type="search" placeholder="Buscar" aria-label="Buscar" />

                <!-- cambiar svg de lupa -->

                <svg class="centro-ayuda-buscador-icono" width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.5" />
                    <path d="M12 12L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </div>

            <!-- TEMAS POPULARES -->
            <h2 class="temas-populares-titulo">Temas populares</h2>

            <div class="temas-populares-grid">
                <a href="ce-propuestas-mejora.html">
                    <article class="tema-card">
                        <div class="tema-card-icono">

                            <!-- cambiar svg -->

                            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                                <circle cx="20" cy="28" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.6" />
                                <circle cx="36" cy="28" r="12" stroke="currentColor" stroke-width="1.5" opacity="0.6" />
                                <path d="M24 22 Q28 28 24 34" stroke="currentColor" stroke-width="1.2" fill="none"
                                    opacity="0.8" />
                                <path d="M32 22 Q28 28 32 34" stroke="currentColor" stroke-width="1.2" fill="none"
                                    opacity="0.8" />
                            </svg>
                        </div>
                        <h3 class="tema-card-texto">Propuestas<br>de mejora</h3>
                    </article>
                </a>
                <a href="ce-factura-compra.html">
                    <article class="tema-card">
                        <div class="tema-card-icono">

                            <!-- cambiar svg -->

                            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                                <rect x="10" y="30" width="36" height="6" rx="2" stroke="currentColor"
                                    stroke-width="1.5" opacity="0.7" />
                                <path d="M14 30 L20 16 L28 22 L34 14 L42 30" stroke="currentColor" stroke-width="1.5"
                                    stroke-linejoin="round" opacity="0.8" />
                                <path d="M30 36 L34 46 M26 36 L22 46" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" opacity="0.6" />
                                <line x1="18" y1="46" x2="38" y2="46" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" opacity="0.5" />
                            </svg>
                        </div>
                        <h3 class="tema-card-texto">Factura<br>de compra</h3>
                    </article>
                </a>
                <a href="ce-cancelar-suscripcion.html">
                    <article class="tema-card">
                        <div class="tema-card-icono">

                            <!-- cambiar svg -->

                            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                                <line x1="16" y1="16" x2="40" y2="40" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" opacity="0.8" />
                                <line x1="40" y1="16" x2="16" y2="40" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" opacity="0.8" />
                            </svg>
                        </div>
                        <h3 class="tema-card-texto">Cancelar<br>suscripción</h3>
                    </article>
                </a>
                <a href="ce-recuperar-contrasena.html">
                    <article class="tema-card">
                        <div class="tema-card-icono">

                            <!-- cambiar svg -->

                            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                                <rect x="10" y="20" width="30" height="20" rx="3" stroke="currentColor"
                                    stroke-width="1.5" opacity="0.7" />
                                <circle cx="18" cy="30" r="2" fill="currentColor" opacity="0.6" />
                                <circle cx="25" cy="30" r="2" fill="currentColor" opacity="0.6" />
                                <circle cx="32" cy="30" r="2" fill="currentColor" opacity="0.6" />
                                <path d="M34 20 L34 14 Q34 10 38 10 L44 10 Q48 10 48 14 L48 24 Q48 28 44 28 L40 28"
                                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
                                <circle cx="44" cy="19" r="2" fill="currentColor" opacity="0.5" />
                            </svg>
                        </div>
                        <h3 class="tema-card-texto">Recuperar<br>contraseña</h3>
                    </article>
                </a>
            </div>

            <!-- CTA CONTACTO -->
            <p class="contacto-cta-texto">Si no consigue resolver su duda...</p>
            <a href="../contacto/index.html">
                <button class="contacto-cta-btn">Contáctanos</button>
            </a>

        </div>

    </main>


    <script src="../../../js/nav.js"></script>
    <script src="../../../js/utils/main.js"></script>
</body>

</html>
