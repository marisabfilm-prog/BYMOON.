<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="BYMOON" />
    <link rel="manifest" href="/site.webmanifest" />


    <title>Recuperar Contraseña | BYMOON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet" />


    <link rel="stylesheet" href="../../../css/utility-clases_variables.css" />
    <link rel="stylesheet" href="../../../css/estrellas.css" />
    <link rel="stylesheet" href="../../../css/botones.css" />
    <link rel="stylesheet" href="../../../css/footer-nav.css" />
    <link rel="stylesheet" href="../../../css/centro-de-ayuda-main.css" />

</head>

<body>

    <main>

        <div class="estrellas-1"></div>
        <div class="estrellas-2"></div>
        <div class="estrellas-3"></div>

        <div class="centro-ayuda-wrap animar">

            <!-- CABECERA -->
            <a href="index.html" class="centro-ayuda-flecha" aria-label="Volver">
                <svg width="8" height="14" viewBox="0 0 8 14" fill="none">
                    <path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>

            <h1 class="centro-ayuda-titulo">Centro de Ayuda</h1>

            <!-- BUSCADOR -->
            <div class="centro-ayuda-buscador-wrap animar">

                <input class="centro-ayuda-buscador" type="search" placeholder="Buscar" aria-label="Buscar" />

                <!-- cambiar svg de lupa -->

                <svg class="centro-ayuda-buscador-icono" width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.5" />
                    <path d="M12 12L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </div>


            <!-- FORMULARIO -->
            <section class="ce-section animar">
                <h2 class="ce-title">Recuperar <span>contraseña</span></h2>

                <p class="ce-subtitle">
                    No te preocupes, suele pasar.<br>
                    Respira y recuperemos tu acceso.
                </p>

                <p class="ce-p">
                    Introduce el correo electrónico asociado a tu cuenta.
                    Te enviaremos un enlace para que puedas volver a tu refugio nocturno en un instante.
                </p>

                <div class="ce-p">
                    <input class="contrasena-input" type="email" placeholder="Correo electrónico"
                        autocomplete="email" />
                </div>

                <a href="ce-recuperar-contrasena-second.html">
                    <button class="contrasena-btn">Enviar</button>
                </a>
            </section>

        </div>
    </main>


    <script src="/js/utils/observer.js"></script>
    <script src="/js/utils/fade-in.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils/main.js"></script>
</body>

</html>
